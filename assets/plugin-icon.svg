<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="screen">
      <stop stop-color="#0d2417"/>
      <stop offset=".65" stop-color="#06130b"/>
      <stop offset="1" stop-color="#020604"/>
    </radialGradient>
    <linearGradient id="phosphor" x1="0" y1="144" x2="0" y2="368" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c7ffd2"/>
      <stop offset=".45" stop-color="#79ff9e"/>
      <stop offset="1" stop-color="#39eb73"/>
    </linearGradient>
    <radialGradient id="vignette">
      <stop offset=".45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".5"/>
    </radialGradient>
    <filter id="wide-bloom" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="near-bloom" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000"/>
    </pattern>
    <pattern id="phosphor-cells" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 0H16V16H0Z" fill="none" stroke="#063d19" stroke-width="2" stroke-opacity=".35"/>
      <path d="M2 13V2H13" fill="none" stroke="#e0ffe7" stroke-width="1" stroke-opacity=".24"/>
    </pattern>
    <g id="code">
      <rect x="160" y="176" width="32" height="16"/>
      <rect x="144" y="192" width="32" height="16"/>
      <rect x="128" y="208" width="32" height="16"/>
      <rect x="112" y="224" width="32" height="16"/>
      <rect x="96" y="240" width="32" height="32"/>
      <rect x="112" y="272" width="32" height="16"/>
      <rect x="128" y="288" width="32" height="16"/>
      <rect x="144" y="304" width="32" height="16"/>
      <rect x="160" y="320" width="32" height="16"/>
      <rect x="320" y="176" width="32" height="16"/>
      <rect x="336" y="192" width="32" height="16"/>
      <rect x="352" y="208" width="32" height="16"/>
      <rect x="368" y="224" width="32" height="16"/>
      <rect x="384" y="240" width="32" height="32"/>
      <rect x="368" y="272" width="32" height="16"/>
      <rect x="352" y="288" width="32" height="16"/>
      <rect x="336" y="304" width="32" height="16"/>
      <rect x="320" y="320" width="32" height="16"/>
      <rect x="272" y="144" width="32" height="48"/>
      <rect x="256" y="192" width="32" height="48"/>
      <rect x="240" y="240" width="32" height="32"/>
      <rect x="224" y="272" width="32" height="48"/>
      <rect x="208" y="320" width="32" height="48"/>
    </g>
  </defs>
  <rect width="512" height="512" fill="url(#screen)"/>
  <g filter="url(#wide-bloom)" opacity=".28">
    <use href="#code" fill="#25ff65"/>
  </g>
  <g filter="url(#near-bloom)" opacity=".5">
    <use href="#code" fill="#4aff80"/>
  </g>
  <g shape-rendering="crispEdges">
    <use href="#code" fill="url(#phosphor)"/>
    <use href="#code" fill="url(#phosphor-cells)"/>
  </g>
  <rect width="512" height="512" fill="url(#scanlines)" opacity=".09"/>
  <rect width="512" height="512" fill="url(#vignette)"/>
</svg>
