name: Build & Draft Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      release: ${{ steps.version.outputs.release }}
      artifact-id: ${{ steps.installer.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Check manifest version
        id: version
        run: node scripts/release.mjs check

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run pack

      - name: Test production behavior
        run: |
          production_tests=()
          for file in tests/*.test.mjs; do
            if [[ "$file" != tests/asset-generators.test.mjs ]]; then
              production_tests+=("$file")
            fi
          done
          node --test "${production_tests[@]}"

      - name: Validate plugin
        run: npm exec --no -- streamdeck validate --no-update-check git.renaudcerrato.deckforge.sdPlugin

      - name: Upload tested installer
        id: installer
        uses: actions/upload-artifact@v7.0.2
        with:
          name: installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/git.renaudcerrato.deckforge.streamDeckPlugin
          if-no-files-found: error

  release:
    needs: check
    if: needs.check.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.check.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: draft-release-${{ needs.check.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.check.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download tested installer
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.check.outputs.artifact-id }}
          path: dist
          merge-multiple: true

      - name: Prepare unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: node scripts/release.mjs draft
